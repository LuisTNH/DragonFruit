[package]
name = "dragonfruit-cli"
version = "2.1.1"
edition = "2021"
default-run = "dragonfruit-cli"

[[bin]]
name = "dragonfruit-cli"
path = "src/main.rs"

[lib]
name = "dragonfruit_cli"
path = "src/lib.rs"

[dependencies]
dragonfruit-slicing-engine = { path = "../dragonfruit-slicing-engine" }
dragonfruit-islands = { path = "../dragonfruit-islands" }
dragonfruit-mesh-scan = { path = "../dragonfruit-mesh-scan" }
dragonfruit-mesh-repair = { path = "../dragonfruit-mesh-repair" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
libc = "0.2"
libdeflater = "1"
flate2 = "1"

[dev-dependencies]
proptest = "1.9.0"
